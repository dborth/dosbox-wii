name: DOSBox Wii

on: [push, pull_request]

jobs:
  build:
    name: Build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["Wii", "WiiU"]
    container: ghcr.io/extremscorner/libogc2:latest

    steps:
    - name: Checkout dosbox-wii repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Wii U dependencies
      if: ${{ matrix.image == 'WiiU' }}
      run: dkp-pacman -Syu --noconfirm wiiu-dev

    - name: Build and install libmocha
      if: ${{ matrix.image == 'WiiU' }}
      run: |
        git clone --depth 1 https://github.com/dborth/libmocha.git /tmp/libmocha
        cd /tmp/libmocha && make install

    - name: Build and install libdvm
      if: ${{ matrix.image == 'WiiU' }}
      run: |
        git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/dborth/libdvm.git /tmp/libdvm
        cd /tmp/libdvm && make install

    - name: Build and install libsmb2
      run: |
        git clone --depth 1 https://github.com/dborth/libsmb2.git /tmp/libsmb2
        cd /tmp/libsmb2
        if [ "${{ matrix.image }}" = "Wii" ]; then
          make -f Makefile.platform wii_install
        elif [ "${{ matrix.image }}" = "GameCube" ]; then
          make -f Makefile.platform gc_install
        elif [ "${{ matrix.image }}" = "WiiU" ]; then
          make -f Makefile.platform wiiu_install
        fi

    - name: Build Wii
      if: ${{ matrix.image == 'Wii' }}
      run: |
        make -f Makefile.wii -j3

    - name: Build Wii U
      if: ${{ matrix.image == 'WiiU' }}
      run: |
        make -f Makefile.wiiu -j3

    - name: Copy artifacts (Wii)
      if: ${{ matrix.image == 'Wii' }}
      run: |
        mkdir -p dist/apps/dosbox-wii
        cp hbc/* dist/apps/dosbox-wii/
        cp executables/dosbox-wii.dol dist/apps/dosbox-wii/boot.dol
        mkdir -p dist/DOSBox
        touch dist/DOSBox/dosboxdir
      
    - name: Upload artifacts (Wii)
      if: ${{ matrix.image == 'Wii' }}
      uses: actions/upload-artifact@v4
      with:
        name: DOSBox-Wii
        path: |
          dist/

    - name: Copy artifacts (Wii U)
      if: ${{ matrix.image == 'WiiU' }}
      run: |
        mkdir -p dist/wiiu/apps/dosbox-wiiu
        cp executables/dosbox-wiiu.wuhb dist/wiiu/apps/dosbox-wiiu/
        cp executables/dosbox-wiiu.rpx dist/wiiu/apps/dosbox-wiiu/

    - name: Upload artifacts (Wii U)
      if: ${{ matrix.image == 'WiiU' }}
      uses: actions/upload-artifact@v4
      with:
        name: DOSBox-WiiU
        path: |
          dist/wiiu/

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/master'

    steps:
    - name: Checkout dosbox-wii repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist

    - name: Re-zip artifact
      run: |
        cd dist/DOSBox-Wii
        rm -r DOSBox/*
        zip -r ../DOSBox-Wii.zip *
        cd ../DOSBox-WiiU
        zip -r ../DOSBox-WiiU.zip *

    - name: Update Git Tag
      run: |
        git tag -f Pre-release
        git push -f origin Pre-release

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        prerelease: true
        allowUpdates: true
        removeArtifacts: true
        replacesArtifacts: false
        tag: Pre-release
        artifacts: "dist/*.zip"
