name: DOSBox Wii

on: [push, pull_request]

jobs:
  build:
    name: Build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["Wii"]
    container: ghcr.io/extremscorner/libogc2:latest

    steps:
    - name: Checkout dosbox-wii repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Build Wii
      if: ${{ matrix.image == 'Wii' }}
      run: |
        make -f Makefile.wii -j3

    - name: Copy artifacts
      run: |
        mkdir -p dist/apps/dosbox-wii
        cp hbc/* dist/apps/dosbox-wii/
        cp dosbox-wii.dol dist/apps/dosbox-wii/boot.dol
        mkdir -p dist/DOSBox
        touch dist/DOSBox/dosboxdir
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DOSBox-Wii
        path: |
          dist/

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/master'

    steps:
    - name: Checkout dosbox-wii repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist

    - name: Re-zip artifact
      run: |
        cd dist/DOSBox-Wii
        rm -r DOSBox/*
        zip -r ../DOSBox-Wii.zip *

    - name: Update Git Tag
      run: |
        git tag -f Pre-release
        git push -f origin Pre-release

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        prerelease: true
        allowUpdates: true
        removeArtifacts: true
        replacesArtifacts: false
        tag: Pre-release
        artifacts: "dist/*.zip"
