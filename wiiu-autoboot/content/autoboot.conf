# title=Hello from the bundle
# program=HELLO.BAT
#
# The game conf of this .wuhb. DOSBox Wii starts with it, reading it after the
# dosbox.conf on the SD card, so it only needs what is different for this game.
#
# This folder (the .wuhb's "content") is read-only on the console, and the files
# next to this one are found by name: GAME below is the GAME folder beside this file.

#[cpu]
#cycles=fixed 8000

# A controls setup made on the console (Games > Save as game) can be copied here as
# autoboot.map, and used with:
#[sdl]
#mapperfile=autoboot.map

[autoexec]
mount c GAME -pr
c:
hello.bat
