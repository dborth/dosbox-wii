# DOSBox Wii as a WiiFlow plugin.
# Put this file in wiiflow/plugins/ on the SD card or USB drive WiiFlow uses.
# Every .conf under romDir then shows up in WiiFlow as a game.
#
# Do not add {loader} to arguments: DOSBox would be handed it as a program to run.
# If you already have a DOSBox plugin ini with magic=44424F58 (the WiiFlow Plugins Pack
# one), replace it with this file, or two plugins will share one magic number.
[PLUGIN]
magic=44424F58
displayname=DOSBox
coverFolder=dosbox-wii
fileTypes=.conf
romDir=DOSBox/Games
# Without a device name WiiFlow looks for this on the SD card, then each USB drive
dolFile=apps/dosbox-wii/boot.dol
# One argument, the game's .conf as DOSBox Wii takes it: sd:/DOSBox/Games/keen4.conf
arguments={device}:/{path}/{name}
# Games on a USB drive: remove the # (0 is the SD card, 1 the first USB partition)
#rompartition=1
